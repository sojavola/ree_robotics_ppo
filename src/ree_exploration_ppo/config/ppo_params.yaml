# ============================================================================
# PPO Hyperparameters — ree_exploration_ppo
# ============================================================================
# Ces valeurs surchargent les défauts de NetworkConfig/TopicConfig (config.py).
# Un nœud ROS2 les lit via declare_parameter() / get_parameter().

ppo_agent:
  ros__parameters:
    robot_id: 0          # surclassé par le launch file par robot

ppo_trainer:
  ros__parameters:
    robot_id: 0          # surclassé par le launch file par robot

    # Chemins de sortie (relatifs au CWD du launch)
    model_dir:    models/ppo/robot_0
    tb_log_dir:   tensorboard_logs/ppo/robot_0
    csv_log_dir:  logs/ppo/robot_0

    # PPO-Clip
    learning_rate:   0.0003
    gamma:           0.99
    clip_eps:        0.2
    n_epochs:        10
    mini_batch_size: 64
    gae_lambda:      0.95
    value_coef:      0.5
    entropy_coef:    0.01
    rollout_steps:   2048
    max_grad_norm:   0.5

    # Divers
    watchdog_timeout_sec:  30.0
    weight_broadcast_freq: 1
